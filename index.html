    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: #121420;
            --bg-card-hover: #1a1d2e;
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --accent-pink: #ff0080;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-card: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Cabecera Destacada para Scroll */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            background: rgba(6, 7, 12, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 4px 15px rgba(0, 242, 254, 0.25);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin: 35px 0 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 22px;
            background: var(--accent-cyan);
            border-radius: 2px;
        }

        .hotel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 20px 24px;
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .hotel-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .hotel-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-cyan), #00c6ff);
            color: #000;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 18px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .day-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            color: var(--accent-cyan);
        }

        .day-location {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .event-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-item {
            display: flex;
            gap: 12px;
            font-size: 0.9rem;
        }

        .event-time {
            color: var(--accent-pink);
            font-weight: 600;
            min-width: 100px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .event-desc-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

            background: linear-gradient(135deg, rgba(255, 0, 128, 0.15), rgba(18, 20, 32, 0.95));
            border: 2px solid var(--accent-pink);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 35px;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.3);
            position: relative;
        }

        .plan-card::before {
            content: 'SEGURIDAD';
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--accent-pink);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }
